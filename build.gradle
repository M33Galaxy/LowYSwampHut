import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer
import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
group 'org.example'
version '1.7.0'
repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        url "https://maven.seedfinding.com"
        }

    maven {
        url "https://maven.latticg.com"
        }

    maven {

        url "https://jitpack.io"

        }
    maven {url "https://repo.jellejurre.dev"}

}
dependencies {
    implementation('com.seedfinding:mc_seed:1.171.2')
    implementation('com.seedfinding:mc_core:1.210.0')
    implementation('com.seedfinding:mc_feature:1.171.9')
    implementation('com.github.jellejurre:seed-checker:1.2.0-1.18.1'){transitive=false}
    implementation 'com.github.KalleStruik:noise-sampler:1.20.0'


    implementation('com.seedfinding:latticg:1.06@jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.1'

}
test {
    useJUnitPlatform()
}

// 源文件为 UTF-8 时必须指定编码，否则 Windows 下 javac 默认 GBK 会破坏中文等字面量
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 统一可执行 JAR：无参数启动 GUI，带 CLI 参数则走命令行搜索
shadowJar {
    archiveBaseName.set('LowYSwampHut')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes 'Main-Class': 'project.Launcher'
        attributes 'Multi-Release': 'true'
    }
    mergeServiceFiles()
    transform(Log4j2PluginsCacheFileTransformer)
    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.handlers', 'META-INF/spring.schemas']
        mergeStrategy = "append"
    }
    exclude 'module-info.class'
}

// 创建 LowYSwampHutForFixedSeed 的可执行 JAR（GUI，与 shadowJar 入口相同）
tasks.register('buildMainJar', ShadowJar) {
    group = 'build'
    description = 'Creates a fat JAR for LowYSwampHutForFixedSeed'
    archiveBaseName.set('LowYSwampHutForFixedSeedGUI')
    archiveClassifier.set('')
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    manifest {
        attributes 'Main-Class': 'project.Launcher'
        attributes 'Multi-Release': 'true'
    }
    mergeServiceFiles()
    transform(Log4j2PluginsCacheFileTransformer)
    transform(PropertiesFileTransformer) {
        paths = ['META-INF/spring.handlers', 'META-INF/spring.schemas']
        mergeStrategy = "append"
    }
    exclude 'module-info.class'
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs CLI search. Example: gradlew runCli -PcliArgs="--seed 123 --max-y -40"'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'project.Launcher'
    if (project.hasProperty('cliArgs')) {
        args cliArgs.split('\\s+')
    } else {
        args '--help'
    }
}

// 创建所有 JAR 的任务
tasks.register('buildAllJars') {
    group = 'build'
    description = 'Builds all executable JARs'
    dependsOn shadowJar, buildMainJar
}

['A', 'B', 'C'].each { profile ->
    tasks.register("benchmark${profile}", JavaExec) {
        group = 'verification'
        description = "Runs LowYSwampHut stress profile ${profile}"
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass.set('project.benchmark.BenchmarkRunner')
        args "--profile=${profile}"
        jvmArgs '-Xms2g', '-Xmx4g'
    }
}

// cubiomes JNI: build DLL and package into JAR resources
def generatedNativeResourcesDir = layout.buildDirectory.dir('generated/native-resources')
def windowsDll = file('native/windows/libLowYSwampHutJ.dll')
def jniBat = file('jni/build-jni.bat')

tasks.register('buildNativeWindows', Exec) {
    group = 'build'
    description = 'Builds libLowYSwampHutJ.dll via jni/build-jni.bat'
    workingDir = file('jni')
    commandLine 'cmd', '/c', 'build-jni.bat'
    onlyIf {
        System.getProperty('os.name').toLowerCase().contains('windows') && jniBat.exists()
    }
    inputs.files(
        fileTree('jni') {
            include 'SwampHutPhase1.cpp', 'SwampHutPhase1.h',
                    'build-jni.bat',
                    'cxx_compat/*.h',
                    'native/jni/**/*.cpp', 'native/jni/**/*.h',
                    'cubiomes/generator.{c,h}', 'cubiomes/layers.{c,h}',
                    'cubiomes/biomenoise.{c,h}', 'cubiomes/biomes.{c,h}',
                    'cubiomes/noise.{c,h}', 'cubiomes/util.{c,h}',
                    'cubiomes/terrainnoise.{c,h}', 'cubiomes/finders.h',
                    'cubiomes/rng.h', 'cubiomes/tables/*.h'
        }
    )
    outputs.file(windowsDll)
}

tasks.register('prepareNativeResources') {
    group = 'build'
    description = 'Collects prebuilt dll/so/dylib from native/ into jar resources'
    dependsOn tasks.named('buildNativeWindows')
    inputs.files(windowsDll)
    outputs.dir(generatedNativeResourcesDir)
    doLast {
        def outDir = generatedNativeResourcesDir.get().asFile
        delete(outDir)
        outDir.mkdirs()
        def windowsDir = file('native/windows')
        if (!windowsDll.exists()) {
            throw new GradleException(
                'Missing native/windows/libLowYSwampHutJ.dll. Run jni/build-jni.bat.')
        }
        copy {
            from(windowsDir)
            include('*.dll')
            into(new File(outDir, 'native/windows'))
        }
        def linuxDir = file('native/linux')
        if (linuxDir.exists()) {
            copy {
                from(linuxDir)
                include('*.so')
                into(new File(outDir, 'native/linux'))
            }
        }
        def macosDir = file('native/macos')
        if (macosDir.exists()) {
            copy {
                from(macosDir)
                include('*.dylib')
                into(new File(outDir, 'native/macos'))
            }
        }
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('prepareNativeResources')
    from(generatedNativeResourcesDir)
}

tasks.named('shadowJar') {
    dependsOn tasks.named('prepareNativeResources')
}

tasks.named('buildMainJar') {
    dependsOn tasks.named('prepareNativeResources')
}

tasks.named('test') {
    dependsOn tasks.named('buildNativeWindows')
}

